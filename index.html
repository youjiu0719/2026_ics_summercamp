<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Academy 創作者學院成果展 | Da Li Educational Center</title>
<meta name="description" content="2026 ICS 夏令營 Creator Academy 成果展 — 九堂課，九段探索旅程。">

<meta property="og:title" content="Creator Academy 創作者學院成果展">
<meta property="og:description" content="2026 ICS 夏令營成果展 — 九堂課，九段探索旅程">
<meta property="og:image" content="./og-image.jpg">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  :root{
    --paper:#FFFFFF;
    --ink:#14213D;
    --ink-soft:#5B6472;
    --ink-faint:#9AA3AF;
    --blue:#3B82F6;
    --blue-deep:#1D4ED8;
    --blue-tint:#EFF6FF;
    --blue-tint-2:#DCEAFB;
    --line:#E6E8EC;
    --line-blue:#B5D4F4;
    --radius:14px;
    --font-display:'Space Grotesk', 'Noto Sans TC', sans-serif;
    --font-body:'Noto Sans TC', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .wrap{max-width:760px; margin:0 auto; padding:0 20px;}

  /* ---------- Hero ---------- */
  .hero{ padding:64px 0 40px; border-bottom:1px solid var(--line); }
  .hero .eyebrow{
    font-family:var(--font-mono); font-size:12px; letter-spacing:0.08em;
    color:var(--blue-deep); margin:0 0 14px;
  }
  .hero h1{
    font-family:var(--font-display); font-weight:600;
    font-size:clamp(32px, 6vw, 48px); line-height:1.15;
    margin:0 0 16px; letter-spacing:-0.01em;
  }
  .hero h1 .en{ display:block; font-size:0.55em; color:var(--ink-soft); font-weight:500; margin-top:4px; }
  .hero p.tagline{ font-size:16px; color:var(--ink-soft); line-height:1.75; max-width:520px; margin:0 0 20px; }
  .hero .dates{
    font-family:var(--font-mono); font-size:13px; color:var(--ink-soft);
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 14px; border:1px solid var(--line); border-radius:99px;
  }

  /* ---------- Month sections ---------- */
  .month-section{ margin-top:8px; }
  .month-head{
    display:flex; align-items:baseline; gap:12px;
    padding:36px 0 4px;
    position:sticky; top:0; background:var(--paper); z-index:2;
  }
  .month-head h2{ font-family:var(--font-display); font-weight:600; font-size:22px; margin:0; }
  .month-head .en{ font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); }
  .trail-hint{ font-size:13px; color:var(--ink-faint); margin:6px 0 0; }

  /* ---------- Trail ---------- */
  .trail{ position:relative; padding:24px 0 20px 44px; }
  .trail::before{
    content:''; position:absolute; left:17px; top:24px; bottom:20px; width:0;
    border-left:1.5px dashed var(--line-blue);
  }
  .month-section:last-child .trail{ padding-bottom:60px; }
  .month-section:last-child .trail::before{ bottom:60px; }

  .station{
    position:relative; margin-bottom:14px;
    opacity:0; transform:translateY(12px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .station.in-view{ opacity:1; transform:translateY(0); }
  .station-badge{
    position:absolute; left:-44px; top:2px; width:30px; height:30px; border-radius:50%;
    background:var(--blue-tint); border:1.5px solid var(--line-blue);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:11px; font-weight:500; color:var(--blue-deep);
    transition:background .25s ease, border-color .25s ease, color .25s ease;
  }
  .station.open .station-badge{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .station-head{
    display:flex; align-items:center; gap:10px; width:100%;
    background:none; border:none; padding:6px 4px; text-align:left; cursor:pointer;
    font-family:inherit; border-radius:10px;
  }
  .station-head:hover{ background:var(--blue-tint); }
  .station-head:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .station-icon{ width:18px; height:18px; color:var(--ink-faint); flex-shrink:0; transition:color .25s ease; }
  .station.open .station-icon{ color:var(--blue-deep); }
  .station-titles{ flex:1; min-width:0; }
  .station-titles .zh{ font-size:15px; font-weight:500; color:var(--ink); margin:0; }
  .station-titles .en{ font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); margin:1px 0 0; }
  .station-chevron{ width:16px; height:16px; color:var(--ink-faint); flex-shrink:0; transition:transform .3s ease; }
  .station.open .station-chevron{ transform:rotate(90deg); color:var(--blue); }

  .station-panel{ overflow:hidden; max-height:0; transition:max-height .4s ease; }
  .station.open .station-panel{ max-height:3000px; }
  .station-panel-inner{ background:var(--blue-tint); border-radius:12px; padding:16px 16px 18px; margin:8px 4px 4px; }

  .intro-text p{ font-size:14px; line-height:1.85; color:#374151; margin:0 0 10px; }
  .intro-text .heading{ font-size:13px; font-weight:700; color:var(--blue-deep); margin:14px 0 6px; }
  .intro-text .heading:first-child{ margin-top:0; }
  .intro-empty{ font-size:13px; color:var(--ink-faint); }

  /* ---------- Session list ---------- */
  .session-list{ margin-top:14px; }
  .session-row{ background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:6px; overflow:hidden; }
  .session-head{
    display:flex; align-items:center; gap:10px; width:100%;
    background:none; border:none; padding:10px 12px; text-align:left; cursor:pointer; font-family:inherit;
  }
  .session-head:hover{ background:var(--blue-tint); }
  .session-date{ font-family:var(--font-mono); font-size:11px; color:var(--blue-deep); flex-shrink:0; }
  .session-title{ flex:1; font-size:13px; color:var(--ink); }
  .session-chevron{ width:14px; height:14px; color:var(--ink-faint); flex-shrink:0; transition:transform .3s ease; }
  .session-row.open .session-chevron{ transform:rotate(90deg); color:var(--blue); }
  .session-body{ overflow:hidden; max-height:0; transition:max-height .35s ease; }
  .session-row.open .session-body{ max-height:1200px; }
  .session-body-inner{ padding:0 12px 12px; }
  .sessions-empty{ font-size:13px; color:var(--ink-faint); margin-top:14px; }
  .session-intro{ font-size:13px; line-height:1.75; color:#374151; margin:0 0 10px; }

  /* ---------- PDF viewer ---------- */
  .pdf-box{ background:#F8FAFC; border:1px solid var(--line); border-radius:10px; padding:10px; }
  .pdf-canvas-wrap{
    background:#F4F5F7; border-radius:6px;
    display:flex; align-items:center; justify-content:center; min-height:160px; overflow:hidden;
  }
  .pdf-canvas-wrap canvas{ max-width:100%; display:block; }
  .pdf-controls{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; padding:0 2px; }
  .pdf-nav-btn{
    background:none; border:1px solid var(--line); border-radius:8px; width:28px; height:28px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
  }
  .pdf-nav-btn:hover:not(:disabled){ border-color:var(--blue); color:var(--blue); }
  .pdf-nav-btn:disabled{ opacity:0.35; cursor:default; }
  .pdf-page-label{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
  .pdf-placeholder{ font-size:13px; color:var(--ink-faint); text-align:center; padding:20px 0; }

  /* ---------- Photos ---------- */
  .photos-label{ font-size:11px; color:var(--ink-faint); margin:12px 0 8px; }
  .photos-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .photos-grid a{ display:block; aspect-ratio:1; border-radius:8px; overflow:hidden; background:var(--blue-tint-2); }
  .photos-grid img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s ease; }
  .photos-grid a:hover img{ transform:scale(1.06); }

  footer{ border-top:1px solid var(--line); padding:28px 0 60px; }
  footer p{ font-size:12px; color:var(--ink-faint); margin:0; }

  @media (max-width:480px){
    .hero{ padding:44px 0 32px; }
    .trail{ padding-left:38px; }
    .trail::before{ left:14px; }
    .station-badge{ left:-38px; width:26px; height:26px; font-size:10px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow">DA LI EDUCATIONAL CENTER · 2026 SUMMER</p>
    <h1>Creator Academy<span class="en">創作者學院成果展</span></h1>
    <p class="tagline">從畫布到博物館，從廚房到 AI 音樂——這個夏天，孩子們走過了九段不同的探索旅程。</p>
    <span class="dates">7.6 — 8.31 · 9 weeks</span>
  </header>

  <div id="months"></div>

  <footer>
    <p>Da Li Educational Center · I.C.S. Creator Academy 2026</p>
  </footer>
</div>

<script src="./data.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const ICONS = {
    'device-ipad': '<rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="18" r="0.6" fill="currentColor" stroke="none"/>',
    'building-monument': '<path d="M4 21h16"/><path d="M4 21V10"/><path d="M20 21V10"/><path d="M2 10l10-6 10 6"/><path d="M8 21v-7"/><path d="M12 21v-7"/><path d="M16 21v-7"/>',
    'chef-hat': '<path d="M8 21h8"/><path d="M9 21v-6"/><path d="M15 21v-6"/><path d="M6 11a4 4 0 0 1 3-6 4 4 0 0 1 3-2 4 4 0 0 1 3 2 4 4 0 0 1 3 6 3 3 0 0 1-3 4H9a3 3 0 0 1-3-4z"/>',
    'palette': '<path d="M12 3a9 9 0 1 0 9 9c0-1-1-2-2-2h-2a2 2 0 0 1-2-2c0-1 .5-1.5 1-2a2 2 0 0 0-1-3.6A9 9 0 0 0 12 3z"/><circle cx="8.5" cy="10.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="7.5" cy="14.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="11" cy="16.5" r="0.8" fill="currentColor" stroke="none"/>',
    'cpu': '<rect x="6" y="6" width="12" height="12" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>',
    'plant-2': '<path d="M12 21v-8"/><path d="M12 13c-4 0-7-3-7-7 4 0 7 3 7 7z"/><path d="M12 9c3-1 5-3 5-6-3 0-5 2-6 5"/>',
    'language': '<path d="M4 8a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4H9l-3 3v-3a4 4 0 0 1-2-4V8z"/><circle cx="12" cy="9" r="0.6" fill="currentColor" stroke="none"/>',
    'swimming': '<path d="M3 17c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0 3-1 4.5 0"/><path d="M3 13c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0 3-1 4.5 0"/><circle cx="17" cy="6" r="1.5"/><path d="M5 10l5-2 3 2-2 3"/>',
    'bus': '<rect x="3" y="6" width="18" height="10" rx="2"/><path d="M3 11h18"/><circle cx="7" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/>'
  };

  function iconSvg(key){
    const inner = ICONS[key] || '<circle cx="12" cy="12" r="8"/>';
    return `<svg class="station-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  }
  function chevronSvg(cls){
    return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`;
  }

  const monthsEl = document.getElementById('months');
  const sessionState = {}; // keyed by `${date}_${slug}`

  MONTHS.forEach(month => {
    // 固定型課程：依 months 欄位判斷是否出現
    // 場次型課程：只要該月份至少有一個場次就出現，且面板只列該月份的場次
    const coursesInMonth = COURSES
      .map(course => {
        if (course.type === 'fixed') {
          return course.months.includes(month.id) ? { course, sessions: null } : null;
        }
        const sessionsInMonth = course.sessions.filter(s => sessionMonth(s.date) === month.id);
        return sessionsInMonth.length ? { course, sessions: sessionsInMonth } : null;
      })
      .filter(Boolean);

    if (!coursesInMonth.length) return;

    const section = document.createElement('section');
    section.className = 'month-section';
    section.innerHTML = `
      <div class="month-head">
        <h2>${month.zh}</h2>
        <span class="en">${month.en}</span>
      </div>
      <p class="trail-hint">向下捲動，點開每一站查看課程內容</p>
      <div class="trail"></div>
    `;
    monthsEl.appendChild(section);

    const trailEl = section.querySelector('.trail');

    coursesInMonth.forEach(({ course, sessions }, idx) => {
      const num = String(idx + 1).padStart(2, '0');
      const station = document.createElement('div');
      station.className = 'station';
      station.innerHTML = `
        <div class="station-badge">${num}</div>
        <button class="station-head" aria-expanded="false">
          ${iconSvg(course.icon)}
          <span class="station-titles">
            <p class="zh">${course.zh}</p>
            <p class="en">${course.en}</p>
          </span>
          ${chevronSvg('station-chevron')}
        </button>
        <div class="station-panel">
          <div class="station-panel-inner">
            <div class="intro-text"></div>
            <div class="sessions-slot"></div>
          </div>
        </div>
      `;
      trailEl.appendChild(station);

      const head = station.querySelector('.station-head');
      let stationLoaded = false;
      head.addEventListener('click', () => {
        const isOpen = station.classList.contains('open');
        trailEl.querySelectorAll('.station.open').forEach(s => {
          if (s !== station){
            s.classList.remove('open');
            s.querySelector('.station-head').setAttribute('aria-expanded', 'false');
          }
        });
        station.classList.toggle('open', !isOpen);
        head.setAttribute('aria-expanded', String(!isOpen));

        if (!isOpen && !stationLoaded){
          stationLoaded = true;
          renderIntro(course, station);
          if (course.type === 'sessions') renderSessionList(course, sessions, station);
        }
      });

      observer.observe(station);
    });
  });

  function renderIntro(course, station){
    const introEl = station.querySelector('.intro-text');
    const blocks = parseIntroText(course.intro);
    introEl.innerHTML = blocks.map(b =>
      b.type === 'heading'
        ? `<p class="heading">${escapeHtml(b.text)}</p>`
        : `<p>${escapeHtml(b.text)}</p>`
    ).join('') || '<p class="intro-empty">簡介準備中。</p>';
  }

  function renderSessionList(course, sessions, station){
    const slot = station.querySelector('.sessions-slot');
    if (!sessions.length){
      slot.innerHTML = '<p class="sessions-empty">場次資料準備中。</p>';
      return;
    }
    const list = document.createElement('div');
    list.className = 'session-list';
    sessions.forEach(session => {
      const key = `${session.date}_${session.slug}`;
      sessionState[key] = { loaded:false, pdfDoc:null, page:1, pageCount:0, rendering:false };

      const row = document.createElement('div');
      row.className = 'session-row';
      row.innerHTML = `
        <button class="session-head" aria-expanded="false">
          <span class="session-date">${formatSessionDate(session.date)}</span>
          <span class="session-title">${escapeHtml(session.title)}</span>
          ${chevronSvg('session-chevron')}
        </button>
        <div class="session-body">
          <div class="session-body-inner">
            ${session.intro ? `<p class="session-intro">${escapeHtml(session.intro)}</p>` : ''}
            <div class="pdf-box">
              <div class="pdf-canvas-wrap"><canvas></canvas></div>
              <div class="pdf-controls">
                <button class="pdf-nav-btn pdf-prev" aria-label="上一頁" disabled>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
                </button>
                <span class="pdf-page-label">—</span>
                <button class="pdf-nav-btn pdf-next" aria-label="下一頁" disabled>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                </button>
              </div>
            </div>
            <div class="photos-section" hidden>
              <p class="photos-label">花絮照片</p>
              <div class="photos-grid"></div>
            </div>
          </div>
        </div>
      `;
      list.appendChild(row);

      const sHead = row.querySelector('.session-head');
      const prevBtn = row.querySelector('.pdf-prev');
      const nextBtn = row.querySelector('.pdf-next');
      let sessionLoaded = false;

      sHead.addEventListener('click', () => {
        const isOpen = row.classList.contains('open');
        row.classList.toggle('open', !isOpen);
        sHead.setAttribute('aria-expanded', String(!isOpen));
        if (!isOpen && !sessionLoaded){
          sessionLoaded = true;
          loadSessionPdf(session, row);
          loadSessionPhotos(session, row);
        }
      });
      prevBtn.addEventListener('click', () => changeSessionPage(key, row, -1));
      nextBtn.addEventListener('click', () => changeSessionPage(key, row, 1));
    });
    slot.innerHTML = '';
    slot.appendChild(list);
  }

  async function loadSessionPdf(session, row){
    const key = `${session.date}_${session.slug}`;
    const wrap = row.querySelector('.pdf-canvas-wrap');
    const label = row.querySelector('.pdf-page-label');
    const prevBtn = row.querySelector('.pdf-prev');
    const nextBtn = row.querySelector('.pdf-next');

    let doc;
    try{
      doc = await pdfjsLib.getDocument(sessionPdfUrl(session.date, session.slug)).promise;
    }catch(e){
      try{
        doc = await pdfjsLib.getDocument(sessionPdfUrlFallback(session.date, session.slug)).promise;
      }catch(e2){
        wrap.innerHTML = '<p class="pdf-placeholder">投影片準備中。</p>';
        label.textContent = '—';
        return;
      }
    }
    sessionState[key].pdfDoc = doc;
    sessionState[key].pageCount = doc.numPages;
    sessionState[key].page = 1;
    await renderSessionPage(key, row);
    prevBtn.disabled = false;
    nextBtn.disabled = doc.numPages <= 1;
  }

  async function renderSessionPage(key, row){
    const s = sessionState[key];
    if (!s.pdfDoc || s.rendering) return;
    s.rendering = true;
    const canvas = row.querySelector('canvas');
    const wrap = row.querySelector('.pdf-canvas-wrap');
    const label = row.querySelector('.pdf-page-label');
    const page = await s.pdfDoc.getPage(s.page);
    const containerWidth = wrap.clientWidth || 280;
    const baseViewport = page.getViewport({ scale: 1 });
    const scale = containerWidth / baseViewport.width;
    const viewport = page.getViewport({ scale });
    const ctx = canvas.getContext('2d');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: ctx, viewport }).promise;
    label.textContent = `${s.page} / ${s.pageCount}`;
    s.rendering = false;
  }

  function changeSessionPage(key, row, delta){
    const s = sessionState[key];
    if (!s.pdfDoc) return;
    const next = s.page + delta;
    if (next < 1 || next > s.pageCount) return;
    s.page = next;
    renderSessionPage(key, row);
    row.querySelector('.pdf-prev').disabled = s.page <= 1;
    row.querySelector('.pdf-next').disabled = s.page >= s.pageCount;
  }

  async function loadSessionPhotos(session, row){
    const files = await listSessionPhotoFiles(session.date, session.slug);
    if (!files.length) return;
    const section = row.querySelector('.photos-section');
    const grid = row.querySelector('.photos-grid');
    grid.innerHTML = files.map(name => {
      const url = sessionPhotoUrl(session.date, session.slug, name);
      return `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${escapeHtml(session.title)} 照片" loading="lazy"></a>`;
    }).join('');
    section.hidden = false;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting){
        entry.target.classList.add('in-view');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
</script>

</body>
</html>
