<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Academy 創作者學院成果展 | Da Li Educational Center</title>
<meta name="description" content="2026 ICS 夏令營 Creator Academy 成果展 — 九堂課，九段探索旅程。">

<meta property="og:title" content="Creator Academy 創作者學院成果展">
<meta property="og:description" content="2026 ICS 夏令營成果展 — 九堂課，九段探索旅程">
<meta property="og:image" content="./og-image.jpg">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  :root{
    --paper:#FFFFFF;
    --ink:#14213D;
    --ink-soft:#5B6472;
    --ink-faint:#9AA3AF;
    --blue:#3B82F6;
    --blue-deep:#1D4ED8;
    --blue-tint:#EFF6FF;
    --blue-tint-2:#DCEAFB;
    --line:#E6E8EC;
    --line-blue:#B5D4F4;
    --radius:14px;
    --font-display:'Space Grotesk', 'Noto Sans TC', sans-serif;
    --font-body:'Noto Sans TC', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .wrap{max-width:760px; margin:0 auto; padding:0 20px;}

  /* ---------- Hero ---------- */
  .hero{
    padding:64px 0 40px;
    border-bottom:1px solid var(--line);
  }
  .hero .eyebrow{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--blue-deep);
    margin:0 0 14px;
  }
  .hero h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(32px, 6vw, 48px);
    line-height:1.15;
    margin:0 0 16px;
    letter-spacing:-0.01em;
  }
  .hero h1 .en{
    display:block;
    font-size:0.55em;
    color:var(--ink-soft);
    font-weight:500;
    margin-top:4px;
  }
  .hero p.tagline{
    font-size:16px;
    color:var(--ink-soft);
    line-height:1.75;
    max-width:520px;
    margin:0 0 20px;
  }
  .hero .dates{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--ink-soft);
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 14px;
    border:1px solid var(--line);
    border-radius:99px;
  }

  /* ---------- Trail intro ---------- */
  .trail-hint{
    font-size:13px;
    color:var(--ink-faint);
    margin:32px 0 4px;
  }

  /* ---------- Trail ---------- */
  .trail{
    position:relative;
    padding:24px 0 60px 44px;
  }
  .trail::before{
    content:'';
    position:absolute;
    left:17px;
    top:24px;
    bottom:60px;
    width:0;
    border-left:1.5px dashed var(--line-blue);
  }
  .station{
    position:relative;
    margin-bottom:14px;
    opacity:0;
    transform:translateY(12px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .station.in-view{
    opacity:1;
    transform:translateY(0);
  }
  .station-badge{
    position:absolute;
    left:-44px;
    top:2px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--blue-tint);
    border:1.5px solid var(--line-blue);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:500;
    color:var(--blue-deep);
    transition:background .25s ease, border-color .25s ease, color .25s ease;
  }
  .station.open .station-badge{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
  }
  .station-head{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    background:none;
    border:none;
    padding:6px 4px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    border-radius:10px;
  }
  .station-head:hover{ background:var(--blue-tint); }
  .station-head:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .station-icon{
    width:18px; height:18px;
    color:var(--ink-faint);
    flex-shrink:0;
    transition:color .25s ease;
  }
  .station.open .station-icon{ color:var(--blue-deep); }
  .station-titles{ flex:1; min-width:0; }
  .station-titles .zh{
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    margin:0;
  }
  .station-titles .en{
    font-size:11px;
    color:var(--ink-faint);
    font-family:var(--font-mono);
    margin:1px 0 0;
  }
  .station-chevron{
    width:16px; height:16px;
    color:var(--ink-faint);
    flex-shrink:0;
    transition:transform .3s ease;
  }
  .station.open .station-chevron{ transform:rotate(90deg); color:var(--blue); }

  .station-panel{
    overflow:hidden;
    max-height:0;
    transition:max-height .4s ease;
  }
  .station.open .station-panel{ max-height:2000px; }
  .station-panel-inner{
    background:var(--blue-tint);
    border-radius:12px;
    padding:16px 16px 18px;
    margin:8px 4px 4px;
  }

  .intro-text p{
    font-size:14px;
    line-height:1.85;
    color:#374151;
    margin:0 0 10px;
  }
  .intro-text .heading{
    font-size:13px;
    font-weight:700;
    color:var(--blue-deep);
    margin:14px 0 6px;
  }
  .intro-text .heading:first-child{ margin-top:0; }
  .intro-loading, .intro-empty{
    font-size:13px;
    color:var(--ink-faint);
  }

  /* ---------- PDF viewer ---------- */
  .pdf-box{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
    margin-top:14px;
  }
  .pdf-canvas-wrap{
    background:#F4F5F7;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:180px;
    overflow:hidden;
  }
  .pdf-canvas-wrap canvas{ max-width:100%; display:block; }
  .pdf-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
    padding:0 2px;
  }
  .pdf-nav-btn{
    background:none;
    border:1px solid var(--line);
    border-radius:8px;
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .pdf-nav-btn:hover:not(:disabled){ border-color:var(--blue); color:var(--blue); }
  .pdf-nav-btn:disabled{ opacity:0.35; cursor:default; }
  .pdf-page-label{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-faint);
  }
  .pdf-placeholder{
    font-size:13px;
    color:var(--ink-faint);
    text-align:center;
    padding:24px 0;
  }

  /* ---------- Photos ---------- */
  .photos-label{
    font-size:11px;
    color:var(--ink-faint);
    margin:16px 0 8px;
  }
  .photos-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:6px;
  }
  .photos-grid a{
    display:block;
    aspect-ratio:1;
    border-radius:8px;
    overflow:hidden;
    background:var(--blue-tint-2);
  }
  .photos-grid img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transition:transform .3s ease;
  }
  .photos-grid a:hover img{ transform:scale(1.06); }

  /* ---------- Footer ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:28px 0 60px;
  }
  footer p{
    font-size:12px;
    color:var(--ink-faint);
    margin:0;
  }

  @media (max-width:480px){
    .hero{ padding:44px 0 32px; }
    .trail{ padding-left:38px; }
    .trail::before{ left:14px; }
    .station-badge{ left:-38px; width:26px; height:26px; font-size:10px; }
    .photos-grid{ grid-template-columns:repeat(3, 1fr); }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow">DA LI EDUCATIONAL CENTER · 2026 SUMMER</p>
    <h1>Creator Academy<span class="en">創作者學院成果展</span></h1>
    <p class="tagline">從畫布到博物館，從廚房到 AI 音樂——這個夏天，孩子們走過了九段不同的探索旅程。</p>
    <span class="dates">7.6 — 8.31 · 9 weeks</span>
  </header>

  <p class="trail-hint">向下捲動，點開每一站查看課程內容</p>

  <div class="trail" id="trail"></div>

  <footer>
    <p>Da Li Educational Center · I.C.S. Creator Academy 2026</p>
  </footer>
</div>

<script src="./data.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const ICONS = {
    'device-ipad': '<rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="18" r="0.6" fill="currentColor" stroke="none"/>',
    'building-monument': '<path d="M4 21h16"/><path d="M4 21V10"/><path d="M20 21V10"/><path d="M2 10l10-6 10 6"/><path d="M8 21v-7"/><path d="M12 21v-7"/><path d="M16 21v-7"/>',
    'chef-hat': '<path d="M8 21h8"/><path d="M9 21v-6"/><path d="M15 21v-6"/><path d="M6 11a4 4 0 0 1 3-6 4 4 0 0 1 3-2 4 4 0 0 1 3 2 4 4 0 0 1 3 6 3 3 0 0 1-3 4H9a3 3 0 0 1-3-4z"/>',
    'palette': '<path d="M12 3a9 9 0 1 0 9 9c0-1-1-2-2-2h-2a2 2 0 0 1-2-2c0-1 .5-1.5 1-2a2 2 0 0 0-1-3.6A9 9 0 0 0 12 3z"/><circle cx="8.5" cy="10.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="7.5" cy="14.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="11" cy="16.5" r="0.8" fill="currentColor" stroke="none"/>',
    'cpu': '<rect x="6" y="6" width="12" height="12" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>',
    'plant-2': '<path d="M12 21v-8"/><path d="M12 13c-4 0-7-3-7-7 4 0 7 3 7 7z"/><path d="M12 9c3-1 5-3 5-6-3 0-5 2-6 5"/>',
    'language': '<path d="M4 8a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4H9l-3 3v-3a4 4 0 0 1-2-4V8z"/><circle cx="12" cy="9" r="0.6" fill="currentColor" stroke="none"/>',
    'swimming': '<path d="M3 17c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0 3-1 4.5 0"/><path d="M3 13c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0 3-1 4.5 0"/><circle cx="17" cy="6" r="1.5"/><path d="M5 10l5-2 3 2-2 3"/>',
    'bus': '<rect x="3" y="6" width="18" height="10" rx="2"/><path d="M3 11h18"/><circle cx="7" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/>'
  };

  function iconSvg(key){
    const inner = ICONS[key] || '<circle cx="12" cy="12" r="8"/>';
    return `<svg class="station-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  }

  const trailEl = document.getElementById('trail');
  const state = {}; // per-course loaded flags + pdf doc + current page

  COURSES.forEach((course, idx) => {
    state[course.id] = { loaded:false, pdfDoc:null, page:1, pageCount:0, rendering:false };

    const num = String(idx + 1).padStart(2, '0');
    const station = document.createElement('div');
    station.className = 'station';
    station.dataset.id = course.id;
    station.innerHTML = `
      <div class="station-badge">${num}</div>
      <button class="station-head" aria-expanded="false">
        ${iconSvg(course.icon)}
        <span class="station-titles">
          <p class="zh">${course.zh}</p>
          <p class="en">${course.en}</p>
        </span>
        <svg class="station-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="station-panel">
        <div class="station-panel-inner">
          <div class="intro-text"><p class="intro-loading">載入中…</p></div>
          <div class="pdf-box">
            <div class="pdf-canvas-wrap"><canvas></canvas></div>
            <div class="pdf-controls">
              <button class="pdf-nav-btn pdf-prev" aria-label="上一頁" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
              </button>
              <span class="pdf-page-label">—</span>
              <button class="pdf-nav-btn pdf-next" aria-label="下一頁" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
              </button>
            </div>
          </div>
          <div class="photos-section" hidden>
            <p class="photos-label">花絮照片</p>
            <div class="photos-grid"></div>
          </div>
        </div>
      </div>
    `;
    trailEl.appendChild(station);

    const head = station.querySelector('.station-head');
    head.addEventListener('click', () => toggleStation(course, station));

    const prevBtn = station.querySelector('.pdf-prev');
    const nextBtn = station.querySelector('.pdf-next');
    prevBtn.addEventListener('click', () => changePage(course.id, station, -1));
    nextBtn.addEventListener('click', () => changePage(course.id, station, 1));
  });

  function toggleStation(course, station){
    const isOpen = station.classList.contains('open');
    document.querySelectorAll('.station.open').forEach(s => {
      if (s !== station){
        s.classList.remove('open');
        s.querySelector('.station-head').setAttribute('aria-expanded', 'false');
      }
    });
    station.classList.toggle('open', !isOpen);
    station.querySelector('.station-head').setAttribute('aria-expanded', String(!isOpen));

    if (!isOpen && !state[course.id].loaded){
      state[course.id].loaded = true;
      loadIntro(course, station);
      loadPdf(course, station);
      loadPhotos(course, station);
    }
  }

  async function loadIntro(course, station){
    const introEl = station.querySelector('.intro-text');
    const raw = await fetchTextFile(courseIntroPath(course.id));
    if (!raw){
      introEl.innerHTML = '<p class="intro-empty">簡介準備中。</p>';
      return;
    }
    const blocks = parseIntroText(raw);
    introEl.innerHTML = blocks.map(b =>
      b.type === 'heading'
        ? `<p class="heading">${escapeHtml(b.text)}</p>`
        : `<p>${escapeHtml(b.text)}</p>`
    ).join('') || '<p class="intro-empty">簡介準備中。</p>';
  }

  async function loadPdf(course, station){
    const canvas = station.querySelector('canvas');
    const wrap = station.querySelector('.pdf-canvas-wrap');
    const label = station.querySelector('.pdf-page-label');
    const prevBtn = station.querySelector('.pdf-prev');
    const nextBtn = station.querySelector('.pdf-next');

    let doc;
    try{
      doc = await pdfjsLib.getDocument(coursePdfUrl(course.id)).promise;
    }catch(e){
      try{
        doc = await pdfjsLib.getDocument(coursePdfUrlFallback(course.id)).promise;
      }catch(e2){
        wrap.innerHTML = '<p class="pdf-placeholder">投影片準備中。</p>';
        label.textContent = '—';
        return;
      }
    }
    state[course.id].pdfDoc = doc;
    state[course.id].pageCount = doc.numPages;
    state[course.id].page = 1;
    await renderPage(course.id, station);
    prevBtn.disabled = false;
    nextBtn.disabled = doc.numPages <= 1;
  }

  async function renderPage(courseId, station){
    const s = state[courseId];
    if (!s.pdfDoc || s.rendering) return;
    s.rendering = true;
    const canvas = station.querySelector('canvas');
    const wrap = station.querySelector('.pdf-canvas-wrap');
    const label = station.querySelector('.pdf-page-label');
    const page = await s.pdfDoc.getPage(s.page);
    const containerWidth = wrap.clientWidth || 300;
    const baseViewport = page.getViewport({ scale: 1 });
    const scale = containerWidth / baseViewport.width;
    const viewport = page.getViewport({ scale });
    const ctx = canvas.getContext('2d');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: ctx, viewport }).promise;
    label.textContent = `${s.page} / ${s.pageCount} · slides.pdf`;
    s.rendering = false;
  }

  function changePage(courseId, station, delta){
    const s = state[courseId];
    if (!s.pdfDoc) return;
    const next = s.page + delta;
    if (next < 1 || next > s.pageCount) return;
    s.page = next;
    renderPage(courseId, station);
    const prevBtn = station.querySelector('.pdf-prev');
    const nextBtn = station.querySelector('.pdf-next');
    prevBtn.disabled = s.page <= 1;
    nextBtn.disabled = s.page >= s.pageCount;
  }

  async function loadPhotos(course, station){
    const files = await listPhotoFiles(course.id);
    if (!files.length) return;
    const section = station.querySelector('.photos-section');
    const grid = station.querySelector('.photos-grid');
    grid.innerHTML = files.map(name => {
      const url = coursePhotoUrl(course.id, name);
      return `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${escapeHtml(course.zh)} 照片" loading="lazy"></a>`;
    }).join('');
    section.hidden = false;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // scroll reveal
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting){
        entry.target.classList.add('in-view');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.station').forEach(el => observer.observe(el));
</script>

</body>
</html>
