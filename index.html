<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Academy 創作者學院成果展 | Da Li Educational Center</title>
<meta name="description" content="2026 ICS 夏令營 Creator Academy 成果展 — 九堂課，九段探索旅程。">

<meta property="og:title" content="Creator Academy 創作者學院成果展">
<meta property="og:description" content="2026 ICS 夏令營成果展 — 九堂課，九段探索旅程">
<meta property="og:image" content="./og-image.jpg">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  :root{
    --paper:#FFFFFF;
    --ink:#1E1B4B;
    --ink-soft:#5C5470;
    --ink-faint:#9B96AD;
    --line:#E5E1F0;

    --indigo:#1E1B4B;
    --indigo-tint:#EEEDFB;
    --gold:#B8860B;
    --gold-tint:#FBF3DD;

    --accent: var(--indigo);
    --accent-tint: var(--indigo-tint);

    --font-display:'Space Grotesk', 'Noto Sans TC', sans-serif;
    --font-body:'Noto Sans TC', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  .wing-aug{ --accent: var(--gold); --accent-tint: var(--gold-tint); }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .wrap{max-width:760px; margin:0 auto;}

  /* ---------- Masthead: full-bleed signage board ---------- */
  .masthead{ background:var(--indigo); color:#fff; padding:44px 20px 26px; }
  .masthead .kicker{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.12em;
    color:#B8AFEA; margin:0 0 16px; text-transform:uppercase;
  }
  .masthead h1{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(30px, 6.5vw, 44px); line-height:1.2;
    margin:0 0 6px; letter-spacing:-0.01em;
  }
  .masthead .zh{ font-family:var(--font-body); font-weight:700; display:block; font-size:0.62em; color:#D9D4F5; margin-top:6px; }
  .masthead .tagline{ font-size:14px; color:#B8AFEA; line-height:1.7; max-width:460px; margin:16px 0 0; }

  .meta-strip{ display:flex; border-bottom:1px solid var(--line); }
  .meta-strip div{
    flex:1; padding:12px 20px; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);
    border-right:1px solid var(--line);
  }
  .meta-strip div:last-child{ border-right:none; }
  .meta-strip strong{ display:block; font-family:var(--font-display); font-size:18px; font-weight:700; color:var(--ink); margin-top:2px; }

  /* ---------- Wing (month) divider ---------- */
  .wing-head{ display:flex; align-items:center; gap:0; }
  .wing-head .tag{
    background:var(--accent); color:#fff; font-family:var(--font-display); font-weight:700;
    font-size:13px; padding:9px 16px; letter-spacing:0.03em;
  }
  .wing-head .label{
    padding:9px 16px; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);
    border-bottom:1px solid var(--line); flex:1;
  }

  /* ---------- Directory entry ---------- */
  .entry{ display:flex; border-bottom:1px solid var(--line); }
  .entry-num{
    width:64px; flex-shrink:0; background:var(--accent-tint);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:26px; color:var(--accent);
    transition:background .2s ease, color .2s ease;
  }
  .entry.open .entry-num{ background:var(--accent); color:#fff; }
  .entry-main{ flex:1; min-width:0; }
  .entry-head{
    display:flex; align-items:center; gap:10px; width:100%;
    background:none; border:none; padding:14px 16px; text-align:left; cursor:pointer; font-family:inherit;
  }
  .entry-head:hover{ background:var(--accent-tint); }
  .entry-head:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .entry-titles{ flex:1; min-width:0; }
  .entry-titles .zh{ font-size:15px; font-weight:700; color:var(--ink); margin:0; }
  .entry-titles .en{ font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono); margin:2px 0 0; }
  .entry-arrow{ width:16px; height:16px; color:var(--ink-faint); flex-shrink:0; transition:transform .3s ease; }
  .entry.open .entry-arrow{ transform:rotate(90deg); color:var(--accent); }

  .entry-panel{ overflow:hidden; max-height:0; transition:max-height .4s ease; }
  .entry.open .entry-panel{ max-height:4000px; }
  .entry-panel-inner{ padding:0 16px 24px; }

  .entry-quote{
    font-size:13.5px; line-height:1.85; color:var(--ink-soft); margin:0 0 16px;
    padding-left:12px; border-left:3px solid var(--accent);
  }
  .entry-quote.empty{ font-style:italic; color:var(--ink-faint); }

  .skill-tags{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 16px; }
  .skill-tag{
    font-family:var(--font-mono); font-size:10.5px; color:var(--accent);
    background:var(--accent-tint); padding:4px 9px; letter-spacing:0.02em;
  }

  /* ---------- Session directory (nested) ---------- */
  .session-index{ background:var(--accent-tint); }
  .session-entry{ display:flex; border-bottom:1px solid var(--paper); }
  .session-entry:last-child{ border-bottom:none; }
  .session-num{
    width:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:10px; color:var(--accent); font-weight:500;
  }
  .session-main{ flex:1; min-width:0; }
  .session-head{
    display:flex; align-items:center; gap:8px; width:100%;
    background:none; border:none; padding:11px 10px 11px 0; text-align:left; cursor:pointer; font-family:inherit;
  }
  .session-title{ flex:1; font-size:13px; color:var(--ink); font-weight:500; }
  .session-head svg{ width:13px; height:13px; color:var(--ink-faint); flex-shrink:0; transition:transform .3s ease; }
  .session-entry.open .session-head svg{ transform:rotate(90deg); color:var(--accent); }
  .session-body{ overflow:hidden; max-height:0; transition:max-height .35s ease; }
  .session-entry.open .session-body{ max-height:1400px; }
  .session-body-inner{ padding:0 12px 16px; }
  .session-intro{ font-size:13px; line-height:1.8; color:var(--ink-soft); margin:0 0 12px; }
  .sessions-empty{ font-size:13px; color:var(--ink-faint); padding:14px 0; font-style:italic; }

  /* ---------- Plate ---------- */
  .plate{ background:#fff; border:1px solid var(--line); }
  .plate-label{
    display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:9.5px;
    color:var(--ink-faint); padding:7px 10px; border-bottom:1px solid var(--line); letter-spacing:0.05em; text-transform:uppercase;
  }
  .plate-body{ padding:12px; }
  .pdf-canvas-wrap{ background:#FAFAFC; display:flex; align-items:center; justify-content:center; min-height:150px; overflow:hidden; }
  .pdf-canvas-wrap canvas{ max-width:100%; display:block; }
  .pdf-controls{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .pdf-nav-btn{
    background:#fff; border:1px solid var(--line); width:26px; height:26px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
  }
  .pdf-nav-btn:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .pdf-nav-btn:disabled{ opacity:0.3; cursor:default; }
  .pdf-page-label{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); }
  .pdf-placeholder{ font-size:12.5px; color:var(--ink-faint); text-align:center; padding:20px 0; font-style:italic; }

  .plate-photos{ margin-top:12px; }
  .photos-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:1px; background:var(--line); }
  .photos-grid a{ display:block; aspect-ratio:1; overflow:hidden; background:var(--accent-tint); }
  .photos-grid img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s ease; }
  .photos-grid a:hover img{ transform:scale(1.05); }

  footer{ background:var(--indigo); padding:20px; }
  footer p{ font-family:var(--font-mono); font-size:11px; color:#B8AFEA; margin:0; letter-spacing:0.03em; text-align:center; }

  @media (max-width:480px){
    .entry-num{ width:52px; font-size:21px; }
    .meta-strip div{ padding:10px 12px; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <p class="kicker">Da Li Educational Center — 2026 Summer</p>
    <h1>Creator Academy<span class="zh">創作者學院成果展</span></h1>
    <p class="tagline">從畫布到博物館，從廚房到 AI 音樂——這個夏天，孩子們走過了九段不同的探索旅程。有人第一次拿起套索工具修圖，有人蹲在博物館展櫃前研究一件文物的來歷，有人在灶台前學會怎麼捏出一顆完美的飯糰。九堂課、十五段場次記錄，是這群小小創作者交出的第一份作品集。</p>
  </div>
</header>

<div class="wrap">
  <div class="meta-strip">
    <div>COURSES<strong>9</strong></div>
    <div>WEEKS<strong>9</strong></div>
    <div>PERIOD<strong>7–8月</strong></div>
  </div>

  <div id="wings"></div>

  <footer>
    <p>Da Li Educational Center · I.C.S. Creator Academy 2026</p>
  </footer>
</div>

<script src="./data.js"></script>
<script>
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  const wingsEl = document.getElementById('wings');
  const sessionState = {};
  const wingLabel = { jul: 'WING A — JULY', aug: 'WING B — AUGUST' };

  function arrowIcon(cls){
    return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
  }

  MONTHS.forEach(month => {
    const coursesInMonth = COURSES
      .map(course => {
        if (course.type === 'fixed') {
          return course.months.includes(month.id) ? { course, sessions: null } : null;
        }
        const sessionsInMonth = course.sessions.filter(s => sessionMonth(s.date) === month.id);
        return sessionsInMonth.length ? { course, sessions: sessionsInMonth } : null;
      })
      .filter(Boolean);

    if (!coursesInMonth.length) return;

    const wing = document.createElement('section');
    wing.className = `wing-${month.id}`;
    wing.innerHTML = `
      <div class="wing-head">
        <span class="tag">${wingLabel[month.id] || month.zh}</span>
        <span class="label">${month.zh} · ${coursesInMonth.length} 堂課</span>
      </div>
    `;
    wingsEl.appendChild(wing);

    coursesInMonth.forEach(({ course, sessions }, idx) => {
      const num = String(idx + 1).padStart(2, '0');
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.innerHTML = `
        <div class="entry-num">${num}</div>
        <div class="entry-main">
          <button class="entry-head" aria-expanded="false">
            <span class="entry-titles">
              <p class="zh">${course.zh}</p>
              <p class="en">${course.en}</p>
            </span>
            ${arrowIcon('entry-arrow')}
          </button>
          <div class="entry-panel">
            <div class="entry-panel-inner">
              <div class="skills-slot"></div>
              <div class="intro-slot"></div>
              <div class="sessions-slot"></div>
            </div>
          </div>
        </div>
      `;
      wing.appendChild(entry);

      const head = entry.querySelector('.entry-head');
      let loaded = false;
      head.addEventListener('click', () => {
        const isOpen = entry.classList.contains('open');
        entry.classList.toggle('open', !isOpen);
        head.setAttribute('aria-expanded', String(!isOpen));
        if (!isOpen && !loaded){
          loaded = true;
          renderSkills(course, entry);
          renderIntro(course, entry);
          if (course.type === 'sessions') renderSessionIndex(course, sessions, entry);
        }
      });
    });
  });

  function renderSkills(course, entry){
    const slot = entry.querySelector('.skills-slot');
    if (!course.skills || !course.skills.length){ slot.innerHTML = ''; return; }
    slot.innerHTML = `<div class="skill-tags">${course.skills.map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('')}</div>`;
  }

  function renderIntro(course, entry){
    const slot = entry.querySelector('.intro-slot');
    const blocks = parseIntroText(course.intro).filter(b => b.type === 'para');
    if (!blocks.length){
      slot.innerHTML = '<p class="entry-quote empty">簡介準備中。</p>';
      return;
    }
    slot.innerHTML = blocks.map(b => `<p class="entry-quote">${escapeHtml(b.text)}</p>`).join('');
  }

  function renderSessionIndex(course, sessions, entry){
    const slot = entry.querySelector('.sessions-slot');
    if (!sessions.length){
      slot.innerHTML = '<p class="sessions-empty">場次資料準備中。</p>';
      return;
    }
    const list = document.createElement('div');
    list.className = 'session-index';
    sessions.forEach(session => {
      const key = `${session.date}_${session.slug}`;
      sessionState[key] = { loaded:false, pdfDoc:null, page:1, pageCount:0, rendering:false };

      const row = document.createElement('div');
      row.className = 'session-entry';
      row.innerHTML = `
        <div class="session-num">${formatSessionDate(session.date)}</div>
        <div class="session-main">
          <button class="session-head" aria-expanded="false">
            <span class="session-title">${escapeHtml(session.title)}</span>
            ${arrowIcon('')}
          </button>
          <div class="session-body">
            <div class="session-body-inner">
              ${session.intro ? `<p class="session-intro">${escapeHtml(session.intro)}</p>` : ''}
              <div class="plate">
                <div class="plate-label"><span>Slides</span><span>${formatSessionDate(session.date)}</span></div>
                <div class="plate-body">
                  <div class="pdf-canvas-wrap"><canvas></canvas></div>
                  <div class="pdf-controls">
                    <button class="pdf-nav-btn pdf-prev" aria-label="上一頁" disabled>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
                    </button>
                    <span class="pdf-page-label">—</span>
                    <button class="pdf-nav-btn pdf-next" aria-label="下一頁" disabled>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                    </button>
                  </div>
                </div>
              </div>
              <div class="plate-photos photos-section" hidden>
                <div class="plate">
                  <div class="plate-label"><span>Photos</span><span>${formatSessionDate(session.date)}</span></div>
                  <div class="plate-body"><div class="photos-grid"></div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      list.appendChild(row);

      const sHead = row.querySelector('.session-head');
      const prevBtn = row.querySelector('.pdf-prev');
      const nextBtn = row.querySelector('.pdf-next');
      let sessionLoaded = false;

      sHead.addEventListener('click', () => {
        const isOpen = row.classList.contains('open');
        row.classList.toggle('open', !isOpen);
        sHead.setAttribute('aria-expanded', String(!isOpen));
        if (!isOpen && !sessionLoaded){
          sessionLoaded = true;
          loadSessionPdf(session, row);
          loadSessionPhotos(session, row);
        }
      });
      prevBtn.addEventListener('click', () => changeSessionPage(key, row, -1));
      nextBtn.addEventListener('click', () => changeSessionPage(key, row, 1));
    });
    slot.innerHTML = '';
    slot.appendChild(list);
  }

  async function loadSessionPdf(session, row){
    const key = `${session.date}_${session.slug}`;
    const wrap = row.querySelector('.pdf-canvas-wrap');
    const label = row.querySelector('.pdf-page-label');
    const prevBtn = row.querySelector('.pdf-prev');
    const nextBtn = row.querySelector('.pdf-next');

    if (typeof pdfjsLib === 'undefined'){
      wrap.innerHTML = '<p class="pdf-placeholder">投影片檢視元件載入失敗，請重新整理頁面。</p>';
      label.textContent = '—';
      return;
    }

    let doc;
    try{
      doc = await pdfjsLib.getDocument(sessionPdfUrl(session.date, session.slug)).promise;
    }catch(e){
      try{
        doc = await pdfjsLib.getDocument(sessionPdfUrlFallback(session.date, session.slug)).promise;
      }catch(e2){
        wrap.innerHTML = '<p class="pdf-placeholder">投影片準備中。</p>';
        label.textContent = '—';
        return;
      }
    }
    sessionState[key].pdfDoc = doc;
    sessionState[key].pageCount = doc.numPages;
    sessionState[key].page = 1;
    await renderSessionPage(key, row);
    prevBtn.disabled = false;
    nextBtn.disabled = doc.numPages <= 1;
  }

  async function renderSessionPage(key, row){
    const s = sessionState[key];
    if (!s.pdfDoc || s.rendering) return;
    s.rendering = true;
    const canvas = row.querySelector('canvas');
    const wrap = row.querySelector('.pdf-canvas-wrap');
    const label = row.querySelector('.pdf-page-label');
    const page = await s.pdfDoc.getPage(s.page);
    const containerWidth = wrap.clientWidth || 260;
    const baseViewport = page.getViewport({ scale: 1 });
    const scale = containerWidth / baseViewport.width;
    const viewport = page.getViewport({ scale });
    const ctx = canvas.getContext('2d');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: ctx, viewport }).promise;
    label.textContent = `${s.page} / ${s.pageCount}`;
    s.rendering = false;
  }

  function changeSessionPage(key, row, delta){
    const s = sessionState[key];
    if (!s.pdfDoc) return;
    const next = s.page + delta;
    if (next < 1 || next > s.pageCount) return;
    s.page = next;
    renderSessionPage(key, row);
    row.querySelector('.pdf-prev').disabled = s.page <= 1;
    row.querySelector('.pdf-next').disabled = s.page >= s.pageCount;
  }

  async function loadSessionPhotos(session, row){
    const files = await listSessionPhotoFiles(session.date, session.slug);
    if (!files.length) return;
    const section = row.querySelector('.photos-section');
    const grid = row.querySelector('.photos-grid');
    grid.innerHTML = files.map(name => {
      const url = sessionPhotoUrl(session.date, session.slug, name);
      return `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${escapeHtml(session.title)} 照片" loading="lazy"></a>`;
    }).join('');
    section.hidden = false;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
